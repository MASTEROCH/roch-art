<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ROCH — страница не найдена</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root{--lime:#D4FF4F;--text:rgba(255,255,255,.97);--text2:rgba(234,244,238,.72);--text3:rgba(234,244,238,.45)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#050706;color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
  body{display:grid;place-items:center;padding:24px;
    background:radial-gradient(60% 50% at 50% 30%,rgba(212,255,79,.12),transparent 70%),#050706}
  main{max-width:420px;text-align:center}
  img{width:132px;height:auto;opacity:.85;margin:0 auto 28px;display:block}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
  h1 span{color:var(--lime)}
  p{margin-top:12px;color:var(--text2);font-weight:500}
  a{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;min-height:56px;padding:16px 28px;border-radius:99px;
    background:var(--lime);color:#0B1409;font-weight:800;text-decoration:none;box-shadow:0 14px 34px rgba(212,255,79,.35)}
  small{display:block;margin-top:16px;font-size:12px;color:var(--text3)}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-hud.png" width="284" height="120" alt="ROCH">
  <h1 id="h">Такой страницы нет — <span>идея ещё впереди</span></h1>
  <p id="p">Ссылка устарела или в адресе опечатка. Главная — в одном нажатии.</p>
  <a href="/" id="a">На главную →</a>
  <small id="s">Вернём на главную через 4 секунды</small>
</main>
<script>
(function(){
  var en = false;
  try{ en = localStorage.getItem('roch_lang') === 'en'; }catch(e){}
  if(en){
    document.documentElement.lang = 'en';
    document.getElementById('h').innerHTML = 'This page doesn’t exist — <span>the idea is still ahead</span>';
    document.getElementById('p').textContent = 'The link is outdated or the address has a typo. The home page is one tap away.';
    document.getElementById('a').textContent = 'Go home →';
    document.getElementById('s').textContent = 'Taking you home in 4 seconds';
  }
  setTimeout(function(){ location.replace('/'); }, 4000);
})();
</script>
</body>
</html>
