<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
:root{--bg:#050706;--text:#fff;--text2:rgba(240,248,243,.88);--lime:#D4FF4F;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(60% 70% at 85% 15%,rgba(212,255,79,.14),transparent 62%),linear-gradient(180deg,#07100B 0%,#050706 100%)}
.pic{position:absolute;left:-90px;top:0;width:620px;height:630px;
  -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 86%,transparent 100%)}
.pic img{width:630px;height:630px;object-fit:cover;object-position:50% 30%;display:block}
.col{position:absolute;left:540px;right:48px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.eb{font-size:24px;font-weight:800;letter-spacing:.01em;color:var(--text2);white-space:nowrap}
.eb b{color:var(--lime);font-weight:900}
h1{margin-top:18px;font-size:82px;line-height:.98;font-weight:900;letter-spacing:-.045em}
h1 span{display:block}
h1 .l{color:var(--lime);text-shadow:0 0 40px rgba(212,255,79,.45)}
.sub{margin-top:22px;font-size:31px;line-height:1.2;font-weight:700;color:var(--text2);letter-spacing:-.02em}
.foot{margin-top:26px;display:flex;align-items:center;gap:18px}
.pill{padding:12px 22px;border-radius:99px;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.01em;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.site{font-size:24px;font-weight:800;color:var(--text)}
</style></head><body><div class="glow"></div>
<div class="pic"><img src="roch-profile.webp" alt=""></div>
<div class="col">
  <div class="eb"><b>ROCH 0→1</b> · creative director</div>
  <h1><span>Your idea —</span><span>into a product</span><span class="l">people buy.</span></h1>
  <p class="sub">A live prototype on your phone in 3 days</p>
  <div class="foot"><span class="pill">Idea unpacking in 2 hours</span><span class="site">roch-art.com</span></div>
</div></body></html>
